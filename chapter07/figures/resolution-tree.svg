<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 650" role="img" aria-labelledby="title desc">
  <title id="title">strong weak 심볼 해석 결정 트리</title>
  <desc id="desc">같은 이름 후보 수, 강한 정의 수, 약한 후보 수에 따라 고유 선택, 강한 정의 선택, 오류, 구현 선택으로 분기하는 결정 트리</desc>
  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#55708f"/></marker>
    <style>
      .bg{fill:#f7f9fc}.q{fill:#fff;stroke:#7ba4df;stroke-width:2}.ok{fill:#e6f4ea;stroke:#58a16b;stroke-width:2}
      .warn{fill:#fff7dd;stroke:#c49a3a;stroke-width:2}.bad{fill:#fce8e6;stroke:#d46a63;stroke-width:2}
      .t{font:700 22px system-ui,sans-serif;fill:#152033}.s{font:600 15px system-ui,sans-serif;fill:#506078}
      .mono{font:700 16px ui-monospace,monospace;fill:#18355d}.line{stroke:#55708f;stroke-width:2.5;fill:none;marker-end:url(#a)}
      .yes{font:700 13px system-ui,sans-serif;fill:#137333}.no{font:700 13px system-ui,sans-serif;fill:#b3261e}
    </style>
  </defs>
  <rect class="bg" width="1100" height="650" rx="24"/>
  <text class="t" x="44" y="48">CSAPP의 세 규칙을 결정 트리로 읽기</text>
  <text class="s" x="44" y="76">여기서 weak는 교재의 분류다. ELF STB_WEAK 및 COMMON과의 차이는 본문에서 분리한다.</text>

  <rect class="q" x="405" y="108" width="290" height="78" rx="16"/>
  <text class="t" x="550" y="140" text-anchor="middle">같은 이름 정의가 여러 개인가?</text>
  <text class="s" x="550" y="165" text-anchor="middle">후보 집합 크기 &gt; 1</text>

  <path class="line" d="M405 147H220V238"/>
  <text class="no" x="300" y="137">아니오</text>
  <rect class="ok" x="75" y="238" width="290" height="78" rx="16"/>
  <text class="t" x="220" y="271" text-anchor="middle">그 정의를 사용</text>
  <text class="s" x="220" y="296" text-anchor="middle">일반적인 해석</text>

  <path class="line" d="M550 186V246"/>
  <text class="yes" x="567" y="222">예</text>
  <rect class="q" x="405" y="246" width="290" height="78" rx="16"/>
  <text class="t" x="550" y="279" text-anchor="middle">strong가 몇 개인가?</text>
  <text class="s" x="550" y="304" text-anchor="middle">함수 또는 초기화된 전역</text>

  <path class="line" d="M405 285H220V392"/>
  <text class="mono" x="293" y="275">0</text>
  <rect class="warn" x="75" y="392" width="290" height="94" rx="16"/>
  <text class="t" x="220" y="426" text-anchor="middle">weak 후보 중 하나</text>
  <text class="s" x="220" y="452" text-anchor="middle">Rule 3: arbitrary / 보장 없음</text>
  <text class="s" x="220" y="474" text-anchor="middle">관측상 입력 순서여도 계약으로 믿지 말 것</text>

  <path class="line" d="M695 285H880V392"/>
  <text class="mono" x="795" y="275">1</text>
  <rect class="ok" x="735" y="392" width="290" height="94" rx="16"/>
  <text class="t" x="880" y="426" text-anchor="middle">strong를 선택</text>
  <text class="s" x="880" y="452" text-anchor="middle">Rule 2</text>
  <text class="s" x="880" y="474" text-anchor="middle">모든 참조가 그 정의로 해석됨</text>

  <path class="line" d="M550 324V430"/>
  <text class="mono" x="567" y="370">2+</text>
  <rect class="bad" x="405" y="430" width="290" height="94" rx="16"/>
  <text class="t" x="550" y="464" text-anchor="middle">링크 오류</text>
  <text class="s" x="550" y="490" text-anchor="middle">Rule 1: multiple definition</text>
  <text class="s" x="550" y="512" text-anchor="middle">실행 파일을 만들지 않음</text>

  <rect class="q" x="150" y="560" width="800" height="56" rx="14"/>
  <text class="s" x="550" y="594" text-anchor="middle">현대 기본값: tentative definition도 -fno-common이면 .bss의 GLOBAL 정의가 되어 Rule 1 오류로 드러난다.</text>
</svg>
