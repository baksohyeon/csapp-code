<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 360 560" role="img" aria-label="Go 사용자 코드는 G P M 조합으로 실행되고 I/O 대기 G는 netpoll에 등록되어 readiness 후 runnable 상태가 되는 구조"><title>Go 사용자 코드는 G P M 조합으로 실행되고 I/O 대기 G는 netpoll에 등록되어 readiness 후 runnable 상태가 되는 구조</title><style>
:root{color-scheme:light dark;--bg:rgb(255,255,255);--ink:rgb(25,40,58);--line:rgb(94,112,134);--a:rgb(20,82,169);--abg:rgb(232,241,255);--b:rgb(0,102,105);--bbg:rgb(225,246,244);--muted:rgb(77,93,115)}
@media(prefers-color-scheme:dark){:root{--bg:rgb(21,29,41);--ink:rgb(235,240,247);--line:rgb(158,178,199);--a:rgb(153,194,255);--abg:rgb(30,51,80);--b:rgb(116,221,209);--bbg:rgb(22,63,63);--muted:rgb(188,201,218)}}
text{fill:var(--ink);font:20px system-ui,sans-serif;text-anchor:middle}.label{font-size:19px;fill:var(--muted)}.title{font-size:23px;font-weight:700}.panel{fill:var(--abg);stroke:var(--a);stroke-width:2}.other{fill:var(--bbg);stroke:var(--b);stroke-width:2}.arrow{fill:none;stroke:var(--line);stroke-width:2;marker-end:url(#arrow)}.dash{stroke-dasharray:6 4}.a{fill:var(--a)}.b{fill:var(--b)}
</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="var(--line)"/></marker></defs><rect width="360" height="560" fill="var(--bg)"/><text x="180" y="32" class="title">Go scheduler</text><rect class="panel" x="25" y="60" width="310" height="65" rx="12"/><text x="180.0" y="99.5" class="">G1 · running</text><path class="arrow" d="M180 128 L180 158"/><rect class="panel" x="25" y="165" width="310" height="65" rx="12"/><text x="180.0" y="204.5" class="">P · runtime 자원</text><path class="arrow" d="M180 233 L180 263"/><rect class="panel" x="25" y="270" width="310" height="65" rx="12"/><text x="180.0" y="309.5" class="">M · OS thread</text><text x="180" y="377" class="title">I/O 대기 경로</text><rect class="other" x="25" y="400" width="310" height="65" rx="12"/><text x="180.0" y="439.5" class="">G2 · waiting I/O</text><path class="arrow dash" d="M180 468 L180 495"/><text x="180" y="523" class="label">netpoll ready → runnable</text></svg>
