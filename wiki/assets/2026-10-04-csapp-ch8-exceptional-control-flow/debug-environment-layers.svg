<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 360 720" role="img" aria-label="Orb amd64의 사용자 공간 번역 실행과 QEMU의 x86 kernel을 포함한 전체 시스템 실행을 구분하는 계층"><title>Orb amd64의 사용자 공간 번역 실행과 QEMU의 x86 kernel을 포함한 전체 시스템 실행을 구분하는 계층</title><style>
:root{color-scheme:light dark;--bg:rgb(255,255,255);--ink:rgb(25,40,58);--line:rgb(94,112,134);--a:rgb(20,82,169);--abg:rgb(232,241,255);--b:rgb(0,102,105);--bbg:rgb(225,246,244);--muted:rgb(77,93,115)}
@media(prefers-color-scheme:dark){:root{--bg:rgb(21,29,41);--ink:rgb(235,240,247);--line:rgb(158,178,199);--a:rgb(153,194,255);--abg:rgb(30,51,80);--b:rgb(116,221,209);--bbg:rgb(22,63,63);--muted:rgb(188,201,218)}}
text{fill:var(--ink);font:20px system-ui,sans-serif;text-anchor:middle}.label{font-size:19px;fill:var(--muted)}.title{font-size:23px;font-weight:700}.panel{fill:var(--abg);stroke:var(--a);stroke-width:2}.other{fill:var(--bbg);stroke:var(--b);stroke-width:2}.arrow{fill:none;stroke:var(--line);stroke-width:2;marker-end:url(#arrow)}.dash{stroke-dasharray:6 4}.a{fill:var(--a)}.b{fill:var(--b)}
</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="var(--line)"/></marker></defs><rect width="360" height="720" fill="var(--bg)"/><text x="180" y="32" class="title">실행 환경 비교</text><rect x="20" y="60" width="320" height="80" rx="12" class="panel"/><text x="180" y="95" class="">Orb amd64</text><text x="180" y="122" class="label">이번 실험: trace 불완전</text><path d="M180 143 L180 172" class="arrow"/><rect x="20" y="180" width="320" height="80" rx="12" class="panel"/><text x="180" y="215" class="">x86 사용자 프로그램</text><text x="180" y="242" class="label">번역 실행 환경</text><text x="180" y="307" class="title">QEMU full-system</text><rect x="20" y="335" width="320" height="80" rx="12" class="other"/><text x="180" y="370" class="">x86 사용자 프로그램</text><text x="180" y="397" class="label">strace · LAB</text><path d="M180 418 L180 447" class="arrow"/><rect x="20" y="455" width="320" height="80" rx="12" class="other"/><text x="180" y="490" class="">x86 Linux kernel</text><text x="180" y="517" class="label">ptrace · syscall 처리</text><path d="M180 538 L180 567" class="arrow"/><rect x="20" y="575" width="320" height="80" rx="12" class="other"/><text x="180" y="610" class="">가상 x86 CPU · TCG</text><text x="180" y="637" class="label">guest OS 실행</text><text x="180" y="696" class="label">이번 full-system LAB: PASS</text></svg>
