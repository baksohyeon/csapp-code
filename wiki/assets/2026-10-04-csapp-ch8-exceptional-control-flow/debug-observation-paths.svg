<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 360 650" role="img" aria-label="프로그램 실행과 출력 확인, strace ptrace를 통한 syscall 관측을 각각 검증하는 두 경로"><title>프로그램 실행과 출력 확인, strace ptrace를 통한 syscall 관측을 각각 검증하는 두 경로</title><style>
:root{color-scheme:light dark;--bg:rgb(255,255,255);--ink:rgb(25,40,58);--line:rgb(94,112,134);--a:rgb(20,82,169);--abg:rgb(232,241,255);--b:rgb(0,102,105);--bbg:rgb(225,246,244);--muted:rgb(77,93,115)}
@media(prefers-color-scheme:dark){:root{--bg:rgb(21,29,41);--ink:rgb(235,240,247);--line:rgb(158,178,199);--a:rgb(153,194,255);--abg:rgb(30,51,80);--b:rgb(116,221,209);--bbg:rgb(22,63,63);--muted:rgb(188,201,218)}}
text{fill:var(--ink);font:20px system-ui,sans-serif;text-anchor:middle}.label{font-size:19px;fill:var(--muted)}.title{font-size:23px;font-weight:700}.panel{fill:var(--abg);stroke:var(--a);stroke-width:2}.other{fill:var(--bbg);stroke:var(--b);stroke-width:2}.arrow{fill:none;stroke:var(--line);stroke-width:2;marker-end:url(#arrow)}.dash{stroke-dasharray:6 4}.a{fill:var(--a)}.b{fill:var(--b)}
</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="var(--line)"/></marker></defs><rect width="360" height="650" fill="var(--bg)"/><text x="180" y="32" class="title">실행과 관측</text><rect x="20" y="65" width="320" height="80" rx="12" class="panel"/><text x="180" y="113" class="">실행: hello 프로그램</text><path d="M180 148 L180 177" class="arrow"/><rect x="20" y="185" width="320" height="80" rx="12" class="panel"/><text x="180" y="220" class="">출력: hello, world</text><text x="180" y="247" class="label">실행 성공 확인</text><text x="180" y="320" class="title">추가로 확인할 경로</text><rect x="20" y="345" width="320" height="80" rx="12" class="other"/><text x="180" y="380" class="">strace · ptrace</text><text x="180" y="407" class="label">kernel tracing 인터페이스</text><path d="M180 428 L180 457" class="arrow"/><rect x="20" y="465" width="320" height="80" rx="12" class="other"/><text x="180" y="500" class="">syscall trace</text><text x="180" y="527" class="label">write · exit_group</text><text x="180" y="600" class="label">두 성공 조건을 각각 검사</text></svg>
