<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 360 470" role="img" aria-label="같은 task가 사용자 코드에서 syscall로 kernel에 진입하고 복귀하며 task 변경 여부는 별도로 결정되는 구조"><title>같은 task가 사용자 코드에서 syscall로 kernel에 진입하고 복귀하며 task 변경 여부는 별도로 결정되는 구조</title><style>
:root{color-scheme:light dark;--bg:rgb(255,255,255);--ink:rgb(25,40,58);--line:rgb(94,112,134);--a:rgb(20,82,169);--abg:rgb(232,241,255);--b:rgb(0,102,105);--bbg:rgb(225,246,244);--muted:rgb(77,93,115)}
@media(prefers-color-scheme:dark){:root{--bg:rgb(21,29,41);--ink:rgb(235,240,247);--line:rgb(158,178,199);--a:rgb(153,194,255);--abg:rgb(30,51,80);--b:rgb(116,221,209);--bbg:rgb(22,63,63);--muted:rgb(188,201,218)}}
text{fill:var(--ink);font:20px system-ui,sans-serif;text-anchor:middle}.label{font-size:19px;fill:var(--muted)}.title{font-size:23px;font-weight:700}.panel{fill:var(--abg);stroke:var(--a);stroke-width:2}.other{fill:var(--bbg);stroke:var(--b);stroke-width:2}.arrow{fill:none;stroke:var(--line);stroke-width:2;marker-end:url(#arrow)}.dash{stroke-dasharray:6 4}.a{fill:var(--a)}.b{fill:var(--b)}
</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="var(--line)"/></marker></defs><rect width="360" height="470" fill="var(--bg)"/><text x="180" y="32" class="title">권한 전환</text><rect class="panel" x="25" y="60" width="310" height="75" rx="12"/><text x="180.0" y="97.5" class="">User code</text><text x="180.0" y="123.5" class="label">같은 task</text><path class="arrow" d="M180 138 L180 185"/><text x="180" y="167" class="label">syscall 진입</text><rect class="other" x="25" y="193" width="310" height="75" rx="12"/><text x="180.0" y="230.5" class="">Kernel code</text><text x="180.0" y="256.5" class="label">권한 검사 · 요청 처리</text><path class="arrow" d="M180 271 L180 318"/><text x="180" y="300" class="label">복귀 가능한 호출</text><rect class="panel" x="25" y="326" width="310" height="75" rx="12"/><text x="180.0" y="363.5" class="">User code</text><text x="180.0" y="389.5" class="label">결과 사용</text><text x="180" y="446" class="label">task 변경은 별도 스케줄링</text></svg>
