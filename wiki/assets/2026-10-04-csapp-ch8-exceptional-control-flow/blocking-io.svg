<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 360 540" role="img" aria-label="blocking I/O는 worker가 기다리는 반면 readiness 기반 I/O는 task를 대기시킨 뒤 worker가 다른 task를 실행하는 비교"><title>blocking I/O는 worker가 기다리는 반면 readiness 기반 I/O는 task를 대기시킨 뒤 worker가 다른 task를 실행하는 비교</title><style>
:root{color-scheme:light dark;--bg:rgb(255,255,255);--ink:rgb(25,40,58);--line:rgb(94,112,134);--a:rgb(20,82,169);--abg:rgb(232,241,255);--b:rgb(0,102,105);--bbg:rgb(225,246,244);--muted:rgb(77,93,115)}
@media(prefers-color-scheme:dark){:root{--bg:rgb(21,29,41);--ink:rgb(235,240,247);--line:rgb(158,178,199);--a:rgb(153,194,255);--abg:rgb(30,51,80);--b:rgb(116,221,209);--bbg:rgb(22,63,63);--muted:rgb(188,201,218)}}
text{fill:var(--ink);font:20px system-ui,sans-serif;text-anchor:middle}.label{font-size:19px;fill:var(--muted)}.title{font-size:23px;font-weight:700}.panel{fill:var(--abg);stroke:var(--a);stroke-width:2}.other{fill:var(--bbg);stroke:var(--b);stroke-width:2}.arrow{fill:none;stroke:var(--line);stroke-width:2;marker-end:url(#arrow)}.dash{stroke-dasharray:6 4}.a{fill:var(--a)}.b{fill:var(--b)}
</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="var(--line)"/></marker></defs><rect width="360" height="540" fill="var(--bg)"/><text x="180" y="32" class="title">I/O 대기와 worker</text><rect class="panel" x="25" y="60" width="310" height="80" rx="12"/><text x="180.0" y="100.0" class="">Blocking I/O</text><text x="180.0" y="126.0" class="label">worker가 호출 안에서 대기</text><path class="arrow" d="M180 143 L180 175"/><rect class="panel" x="25" y="183" width="310" height="65" rx="12"/><text x="180.0" y="222.5" class="">I/O 완료 → 호출 복귀</text><rect class="other" x="25" y="295" width="310" height="80" rx="12"/><text x="180.0" y="335.0" class="">Readiness 기반 I/O</text><text x="180.0" y="361.0" class="label">task 대기 등록</text><path class="arrow" d="M180 378 L180 410"/><rect class="other" x="25" y="418" width="310" height="80" rx="12"/><text x="180.0" y="458.0" class="">worker → 다른 task</text><text x="180.0" y="484.0" class="label">ready → 대기 task 재개</text></svg>
