<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 360 600" role="img" aria-label="CPU가 사건을 인식하고 handler가 처리한 뒤 사건의 종류에 따라 현재 명령 다음 명령 또는 종료로 이어지는 흐름"><title>CPU가 사건을 인식하고 handler가 처리한 뒤 사건의 종류에 따라 현재 명령 다음 명령 또는 종료로 이어지는 흐름</title><style>
:root{color-scheme:light dark;--bg:rgb(255,255,255);--ink:rgb(25,40,58);--line:rgb(94,112,134);--a:rgb(20,82,169);--abg:rgb(232,241,255);--b:rgb(0,102,105);--bbg:rgb(225,246,244);--muted:rgb(77,93,115)}
@media(prefers-color-scheme:dark){:root{--bg:rgb(21,29,41);--ink:rgb(235,240,247);--line:rgb(158,178,199);--a:rgb(153,194,255);--abg:rgb(30,51,80);--b:rgb(116,221,209);--bbg:rgb(22,63,63);--muted:rgb(188,201,218)}}
text{fill:var(--ink);font:20px system-ui,sans-serif;text-anchor:middle}.label{font-size:19px;fill:var(--muted)}.title{font-size:23px;font-weight:700}.panel{fill:var(--abg);stroke:var(--a);stroke-width:2}.other{fill:var(--bbg);stroke:var(--b);stroke-width:2}.arrow{fill:none;stroke:var(--line);stroke-width:2;marker-end:url(#arrow)}.dash{stroke-dasharray:6 4}.a{fill:var(--a)}.b{fill:var(--b)}
</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="var(--line)"/></marker></defs><rect width="360" height="600" fill="var(--bg)"/><text x="180" y="32" class="title">예외와 재개</text><rect class="panel" x="25" y="55" width="310" height="65" rx="12"/><text x="180.0" y="94.5" class="">현재 실행</text><path class="arrow" d="M180 123 L180 153"/><rect class="panel" x="25" y="160" width="310" height="75" rx="12"/><text x="180.0" y="197.5" class="">CPU 사건 인식</text><text x="180.0" y="223.5" class="label">상태 보존 · handler 선택</text><path class="arrow" d="M180 238 L180 268"/><rect class="other" x="25" y="275" width="310" height="75" rx="12"/><text x="180.0" y="312.5" class="">Kernel handler</text><text x="180.0" y="338.5" class="label">원인 처리</text><path class="arrow" d="M180 353 L180 383"/><rect class="other" x="25" y="390" width="310" height="65" rx="12"/><text x="180.0" y="429.5" class="">재개 또는 종료</text><text x="180" y="489" class="">Fault → 현재 명령 재시도</text><text x="180" y="529" class="">Trap · interrupt → 실행 계속</text><text x="180" y="575" class="label">Abort → 안정적 재시작 없음</text></svg>
