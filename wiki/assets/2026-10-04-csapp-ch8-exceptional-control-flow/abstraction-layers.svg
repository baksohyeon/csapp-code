<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 360 480" role="img" aria-label="사용자 공간의 application runtime libc에서 syscall 경계를 통해 kernel과 hardware로 이어지는 계층"><title>사용자 공간의 application runtime libc에서 syscall 경계를 통해 kernel과 hardware로 이어지는 계층</title><style>
:root{color-scheme:light dark;--bg:rgb(255,255,255);--ink:rgb(25,40,58);--line:rgb(94,112,134);--a:rgb(20,82,169);--abg:rgb(232,241,255);--b:rgb(0,102,105);--bbg:rgb(225,246,244);--muted:rgb(77,93,115)}
