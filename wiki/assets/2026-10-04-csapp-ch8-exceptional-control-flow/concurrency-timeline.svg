<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 360 520" role="img" aria-label="위 패널의 단일 코어에서는 A와 B가 교대로 실행되고 아래 패널의 두 코어에서는 실행 구간이 겹치는 타임라인"><title>위 패널의 단일 코어에서는 A와 B가 교대로 실행되고 아래 패널의 두 코어에서는 실행 구간이 겹치는 타임라인</title><style>
:root{color-scheme:light dark;--bg:rgb(255,255,255);--ink:rgb(25,40,58);--line:rgb(94,112,134);--a:rgb(20,82,169);--abg:rgb(232,241,255);--b:rgb(0,102,105);--bbg:rgb(225,246,244);--muted:rgb(77,93,115)}
@media(prefers-color-scheme:dark){:root{--bg:rgb(21,29,41);--ink:rgb(235,240,247);--line:rgb(158,178,199);--a:rgb(153,194,255);--abg:rgb(30,51,80);--b:rgb(116,221,209);--bbg:rgb(22,63,63);--muted:rgb(188,201,218)}}
text{fill:var(--ink);font:20px system-ui,sans-serif;text-anchor:middle}.label{font-size:19px;fill:var(--muted)}.title{font-size:23px;font-weight:700}.panel{fill:var(--abg);stroke:var(--a);stroke-width:2}.other{fill:var(--bbg);stroke:var(--b);stroke-width:2}.arrow{fill:none;stroke:var(--line);stroke-width:2;marker-end:url(#arrow)}.dash{stroke-dasharray:6 4}.a{fill:var(--a)}.b{fill:var(--b)}
</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="var(--line)"/></marker></defs><rect width="360" height="520" fill="var(--bg)"/><text x="180" y="28" class="title">실행 구간 비교</text><text x="180" y="55" class="title">단일 코어 · 교대 실행</text><text x="44" y="122" class="label">A</text><path d="M88 137 H337" stroke="var(--line)" fill="none"/><rect x="92" y="100" width="56" height="30" rx="4" class="a"/><rect x="208" y="100" width="56" height="30" rx="4" class="a"/><text x="44" y="180" class="label">B</text><path d="M88 195 H337" stroke="var(--line)" fill="none"/><rect x="150" y="158" width="56" height="30" rx="4" class="b"/><rect x="266" y="158" width="56" height="30" rx="4" class="b"/><path class="arrow" d="M90 230 L335 230"/><text x="210" y="257" class="label">시간 →</text><text x="180" y="285" class="title">두 코어 · 병렬 실행</text><text x="44" y="352" class="label">CPU 1</text><path d="M88 367 H337" stroke="var(--line)" fill="none"/><rect x="92" y="330" width="56" height="30" rx="4" class="a"/><rect x="208" y="330" width="56" height="30" rx="4" class="a"/><text x="44" y="410" class="label">CPU 2</text><path d="M88 425 H337" stroke="var(--line)" fill="none"/><rect x="92" y="388" width="56" height="30" rx="4" class="b"/><rect x="208" y="388" width="56" height="30" rx="4" class="b"/><path class="arrow" d="M90 460 L335 460"/><text x="210" y="487" class="label">시간 →</text></svg>
