<svg xmlns="http://www.w3.org/2000/svg" width="960" height="340" viewBox="0 0 960 340"><style>text{font-family:system-ui,sans-serif;fill:#172936}.t{font-size:22px;font-weight:700}.s{font-size:15px}.axis{stroke:#8293a0;stroke-width:2}.a{fill:#dbeafe;stroke:#6093d8}.b{fill:#dcfce7;stroke:#55a56d}</style><text x="30" y="38" class="t">Concurrency와 parallel execution</text><text x="30" y="83" class="s">Single core: 실행 구간이 겹치도록 번갈아 진행</text><line x1="180" y1="105" x2="900" y2="105" class="axis"/><rect x="200" y="120" width="140" height="42" rx="8" class="a"/><rect x="500" y="120" width="140" height="42" rx="8" class="a"/><text x="125" y="147" class="s">Task A</text><rect x="350" y="172" width="140" height="42" rx="8" class="b"/><rect x="650" y="172" width="140" height="42" rx="8" class="b"/><text x="125" y="199" class="s">Task B</text><text x="30" y="260" class="s">Two cores: 같은 시간에 실제 실행</text><rect x="200" y="275" width="560" height="40" rx="8" class="a"/><rect x="330" y="225" width="560" height="40" rx="8" class="b"/><text x="125" y="301" class="s">Core 1</text><text x="125" y="251" class="s">Core 2</text></svg>