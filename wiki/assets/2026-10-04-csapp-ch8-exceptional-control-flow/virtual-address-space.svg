<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 360 550" role="img" aria-label="두 프로세스의 같은 가상 주소가 각각의 page table로 다른 물리 페이지에 연결되며 공유 mapping도 가능한 구조"><title>두 프로세스의 같은 가상 주소가 각각의 page table로 다른 물리 페이지에 연결되며 공유 mapping도 가능한 구조</title><style>
:root{color-scheme:light dark;--bg:rgb(255,255,255);--ink:rgb(25,40,58);--line:rgb(94,112,134);--a:rgb(20,82,169);--abg:rgb(232,241,255);--b:rgb(0,102,105);--bbg:rgb(225,246,244);--muted:rgb(77,93,115)}
@media(prefers-color-scheme:dark){:root{--bg:rgb(21,29,41);--ink:rgb(235,240,247);--line:rgb(158,178,199);--a:rgb(153,194,255);--abg:rgb(30,51,80);--b:rgb(116,221,209);--bbg:rgb(22,63,63);--muted:rgb(188,201,218)}}
text{fill:var(--ink);font:20px system-ui,sans-serif;text-anchor:middle}.label{font-size:19px;fill:var(--muted)}.title{font-size:23px;font-weight:700}.panel{fill:var(--abg);stroke:var(--a);stroke-width:2}.other{fill:var(--bbg);stroke:var(--b);stroke-width:2}.arrow{fill:none;stroke:var(--line);stroke-width:2;marker-end:url(#arrow)}.dash{stroke-dasharray:6 4}.a{fill:var(--a)}.b{fill:var(--b)}
</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="var(--line)"/></marker></defs><rect width="360" height="550" fill="var(--bg)"/><text x="180" y="32" class="title">주소 변환</text><rect class="panel" x="20" y="65" width="150" height="85" rx="12"/><text x="95.0" y="107.5" class="">Process A</text><text x="95.0" y="133.5" class="label">VA 0x1000</text><rect class="other" x="190" y="65" width="150" height="85" rx="12"/><text x="265.0" y="107.5" class="">Process B</text><text x="265.0" y="133.5" class="label">VA 0x1000</text><path class="arrow" d="M95 153 L95 195"/><path class="arrow" d="M265 153 L265 195"/><rect class="panel" x="20" y="205" width="150" height="70" rx="12"/><text x="95.0" y="247.0" class="">A page table</text><rect class="other" x="190" y="205" width="150" height="70" rx="12"/><text x="265.0" y="247.0" class="">B page table</text><path class="arrow" d="M95 278 L95 325"/><path class="arrow" d="M265 278 L265 325"/><rect class="panel" x="20" y="335" width="150" height="70" rx="12"/><text x="95.0" y="377.0" class="">물리 X</text><rect class="other" x="190" y="335" width="150" height="70" rx="12"/><text x="265.0" y="377.0" class="">물리 Y</text><text x="180" y="460" class="">MMU가 주소 변환</text><text x="180" y="497" class="label">공유 mapping: 같은 물리 page</text><text x="180" y="530" class="label">주소는 설명용 예시</text></svg>
